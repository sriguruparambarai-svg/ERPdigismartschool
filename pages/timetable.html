<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Table — DigiSmart ERP</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.tt-grid{display:grid;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.tt-header{background:var(--maroon);color:var(--sandal);font-size:12px;font-weight:700;padding:10px 8px;text-align:center}
.tt-cell{padding:8px 6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:12px;min-height:52px;cursor:pointer;transition:background .12s;position:relative}
.tt-cell:hover{background:var(--sandal-light)}
.tt-cell.filled{background:#FDF8F0}
.tt-cell .sub-name{font-weight:600;color:var(--maroon);font-size:12px}
.tt-cell .teacher{font-size:10px;color:var(--text-muted);margin-top:2px}
.tt-day-label{background:var(--sandal-light);font-weight:700;font-size:12px;color:var(--maroon);padding:10px 8px;text-align:center;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.period-header{background:#F7F4F0;font-size:10px;font-weight:600;color:var(--text-muted);text-align:center;padding:6px 4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.subject-chip{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;margin:2px;cursor:pointer;border:1.5px solid transparent}
.subject-chip:hover{border-color:var(--gold)}
.subject-chip.selected{border-color:var(--maroon)}
.cell-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center}
.cell-modal.open{display:flex}
.cell-box{background:#fff;border-radius:14px;padding:20px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="erp-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <div class="page-title">Time Table</div>
      </div>
      <div class="topbar-right">
        <div style="font-size:12px;color:#9B928A" id="today-date"></div>
      </div>
    </div>

    <div class="page-body">

      <!-- Controls -->
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
          <div>
            <label class="form-label">Class</label>
            <select id="tt-class" class="form-control" style="width:150px;margin-top:4px" onchange="loadTimetable()">
              <option value="">Select Class</option>
              <option>LKG</option><option>UKG</option>
              <option>Class 1</option><option>Class 2</option><option>Class 3</option>
              <option>Class 4</option><option>Class 5</option><option>Class 6</option>
              <option>Class 7</option><option>Class 8</option><option>Class 9</option>
              <option>Class 10</option><option>Class 11</option><option>Class 12</option>
            </select>
          </div>
          <div>
            <label class="form-label">Section</label>
            <select id="tt-section" class="form-control" style="width:100px;margin-top:4px" onchange="loadTimetable()">
              <option value="">All</option>
              <option>A</option><option>B</option><option>C</option>
            </select>
          </div>
          <div>
            <label class="form-label">Periods per Day</label>
            <select id="tt-periods" class="form-control" style="width:120px;margin-top:4px" onchange="buildGrid()">
              <option value="7">7 Periods</option>
              <option value="8" selected>8 Periods</option>
              <option value="9">9 Periods</option>
            </select>
          </div>
          <button class="btn btn-gold" onclick="saveTimetable()">💾 Save Timetable</button>
          <button class="btn btn-secondary" onclick="clearTimetable()">Clear All</button>
          <button class="btn btn-primary" onclick="window.print()">🖨 Print</button>
        </div>
      </div>

      <!-- Subject Palette -->
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:12px;font-weight:600;color:var(--maroon)">Click subject to select, then click any period cell to assign:</span>
          <div id="subject-palette" style="display:flex;flex-wrap:wrap;gap:4px"></div>
          <button onclick="addCustomSubject()" class="btn btn-secondary btn-sm">+ Custom</button>
        </div>
      </div>

      <!-- Timetable Grid -->
      <div class="card" id="tt-card">
        <div id="tt-placeholder" class="empty-state">
          <div class="icon">🗓</div>
          <p>Select a class above to build or view the timetable</p>
        </div>
        <div id="tt-container" class="hidden"></div>
      </div>

    </div>
  </div>
</div>

<!-- Cell Edit Modal -->
<div class="cell-modal" id="cell-modal">
  <div class="cell-box">
    <div style="font-size:15px;font-weight:700;color:var(--maroon);margin-bottom:14px" id="cell-modal-title">Set Period</div>
    <div style="margin-bottom:10px">
      <label class="form-label">Subject</label>
      <select id="cell-subject" class="form-control" style="margin-top:4px">
        <option value="">-- Free Period --</option>
        <option>Tamil</option><option>English</option><option>Mathematics</option>
        <option>Science</option><option>Social Science</option><option>Computer</option>
        <option>Hindi</option><option>Drawing</option><option>PT</option>
        <option>Library</option><option>Assembly</option><option>Lunch</option>
        <option>Other</option>
      </select>
    </div>
    <div style="margin-bottom:14px">
      <label class="form-label">Teacher (optional)</label>
      <input type="text" id="cell-teacher" class="form-control" placeholder="Teacher name" style="margin-top:4px">
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="applyCell()" class="btn btn-gold" style="flex:1">Apply</button>
      <button onclick="clearCell()" class="btn btn-secondary btn-sm">Clear</button>
      <button onclick="closeCellModal()" class="btn btn-secondary btn-sm">Cancel</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/sidebar.js"></script>
<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SUBJECTS = ['Tamil','English','Mathematics','Science','Social Science','Computer','Hindi','Drawing','PT','Library','Assembly','Lunch','Break'];
const COLORS = {'Tamil':'#FFF0E6','English':'#E6F4FF','Mathematics':'#F0FFE6','Science':'#E6FFF4','Social Science':'#FFF8E6','Computer':'#F0E6FF','Hindi':'#FFE6F4','Drawing':'#E6F0FF','PT':'#E6FFE6','Library':'#FFF0E6','Assembly':'#F5F0FF','Lunch':'#FFECE6','Break':'#F7F4F0'};

let ttData = {}; // {day_period: {subject, teacher}}
let currentCell = null;
let selectedSubject = '';

document.addEventListener('DOMContentLoaded', () => {
  renderSidebar('icard');
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'short',year:'numeric'});
  buildSubjectPalette();
});

function buildSubjectPalette() {
  const palette = document.getElementById('subject-palette');
  palette.innerHTML = SUBJECTS.map(s => {
    const color = COLORS[s] || '#F7F4F0';
    return `<span class="subject-chip" onclick="selectSubject('${s}',this)" style="background:${color}">${s}</span>`;
  }).join('');
}

function selectSubject(sub, el) {
  selectedSubject = sub;
  document.querySelectorAll('.subject-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  showToast('Selected: ' + sub + ' — now click any period cell','info');
}

function addCustomSubject() {
  const name = prompt('Enter custom subject name:');
  if (!name?.trim()) return;
  SUBJECTS.push(name.trim());
  COLORS[name.trim()] = '#FDF8F0';
  buildSubjectPalette();
  const opt = document.createElement('option');
  opt.textContent = name.trim();
  document.getElementById('cell-subject').appendChild(opt);
}

function buildGrid() {
  const cls = document.getElementById('tt-class').value;
  if (!cls) return;
  const periods = parseInt(document.getElementById('tt-periods').value);
  const sec = document.getElementById('tt-section').value;

  document.getElementById('tt-placeholder').classList.add('hidden');
  document.getElementById('tt-container').classList.remove('hidden');

  const times = generateTimes(periods);

  let html = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr>
      <th style="background:var(--maroon);color:var(--sandal);padding:10px 12px;text-align:left;width:90px">Day / Period</th>
      ${times.map((t,i) => `<th style="background:var(--maroon);color:var(--sandal);padding:8px 6px;text-align:center;min-width:90px">
        <div style="font-size:11px;font-weight:700">Period ${i+1}</div>
        <div style="font-size:10px;opacity:.8">${t}</div>
      </th>`).join('')}
    </tr></thead>
    <tbody>
      ${DAYS.map(day => `
        <tr>
          <td style="background:var(--sandal-light);font-weight:700;color:var(--maroon);padding:10px 8px;border:1px solid var(--border);text-align:center">${day.slice(0,3)}</td>
          ${Array.from({length:periods},(_,p) => {
            const key = day+'_'+p;
            const entry = ttData[key] || {};
            const color = entry.subject ? (COLORS[entry.subject]||'#FDF8F0') : '#fff';
            return `<td onclick="cellClick('${day}',${p})" style="border:1px solid var(--border);padding:7px 6px;text-align:center;cursor:pointer;background:${color};transition:background .12s" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">
              ${entry.subject ? `<div style="font-weight:600;font-size:12px;color:var(--maroon)">${entry.subject}</div><div style="font-size:10px;color:var(--text-muted)">${entry.teacher||''}</div>` : '<div style="font-size:10px;color:#ccc">—</div>'}
            </td>`;
          }).join('')}
        </tr>
      `).join('')}
    </tbody>
  </table></div>`;

  document.getElementById('tt-container').innerHTML = html;
}

function generateTimes(periods) {
  const times = [];
  let hour = 9, min = 0;
  for (let i = 0; i < periods; i++) {
    times.push(`${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}`);
    min += 45;
    if (min >= 60) { hour++; min -= 60; }
    if (i === 2) { min += 15; } // break after 3rd period
    if (min >= 60) { hour++; min -= 60; }
  }
  return times;
}

function cellClick(day, period) {
  const key = day + '_' + period;
  if (selectedSubject) {
    // Direct assign
    ttData[key] = { subject: selectedSubject, teacher: '' };
    buildGrid();
  } else {
    // Open modal
    currentCell = key;
    const entry = ttData[key] || {};
    document.getElementById('cell-modal-title').textContent = day + ' — Period ' + (period+1);
    document.getElementById('cell-subject').value = entry.subject || '';
    document.getElementById('cell-teacher').value = entry.teacher || '';
    document.getElementById('cell-modal').classList.add('open');
  }
}

function applyCell() {
  if (!currentCell) return;
  const sub = document.getElementById('cell-subject').value;
  const teacher = document.getElementById('cell-teacher').value.trim();
  if (sub) { ttData[currentCell] = { subject: sub, teacher }; }
  else { delete ttData[currentCell]; }
  closeCellModal();
  buildGrid();
}

function clearCell() {
  if (currentCell) delete ttData[currentCell];
  closeCellModal();
  buildGrid();
}

function closeCellModal() { document.getElementById('cell-modal').classList.remove('open'); currentCell = null; }

function clearTimetable() {
  if (!confirm('Clear entire timetable?')) return;
  ttData = {};
  buildGrid();
}

async function loadTimetable() {
  const cls = document.getElementById('tt-class').value;
  const sec = document.getElementById('tt-section').value;
  if (!cls) return;
  const { data } = await supabase.from('timetables').select('grid').eq('school_id',SCHOOL_ID).eq('class',cls).eq('section',sec||'').eq('academic_year','2026-27').single();
  if (data?.grid) {
    ttData = data.grid;
  } else {
    ttData = {};
  }
  buildGrid();
}

async function saveTimetable() {
  const cls = document.getElementById('tt-class').value;
  const sec = document.getElementById('tt-section').value;
  const periods = document.getElementById('tt-periods').value;
  if (!cls) { showToast('Please select a class first.','error'); return; }
  showLoading('Saving timetable...');
  const { error } = await supabase.from('timetables').upsert([{
    school_id: SCHOOL_ID,
    class: cls,
    section: sec || '',
    academic_year: '2026-27',
    grid: ttData,
    updated_at: new Date().toISOString()
  }], { onConflict: 'school_id,class,section,academic_year' });
  hideLoading();
  if (error) { showToast('Error: '+error.message,'error'); return; }
  showToast('Timetable saved for ' + cls + '!','success');
}

document.getElementById('cell-modal').addEventListener('click', function(e) {
  if (e.target === this) closeCellModal();
});
</script>
</body>
</html>
